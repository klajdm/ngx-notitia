name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Build library
        run: npm run build
