<!-- Hero -->
<div class="text-center py-16 px-4">
  <h1 class="text-primary text-5xl font-bold pb-2">Angular Notitia</h1>
  <p class="text-body text-lg mb-8">Modern toast notifications for Angular</p>
</div>

<!-- Playground -->
<div id="playground" class="glass-card rounded-2xl mb-20">
  <!-- Content row -->
  <div class="px-8 pt-5 pb-5">
    <p class="section-label">Content</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="toastTitle" class="field-label">Title</label>
        <input
          [(ngModel)]="title"
          type="text"
          class="field-input"
          name="toastTitle"
          id="toastTitle"
          placeholder="Toast title"
        />
      </div>
      <div>
        <label for="toastMessage" class="field-label">Message</label>
        <textarea
          [(ngModel)]="message"
          rows="1"
          class="field-input resize-none overflow-y-auto"
          style="field-sizing: content; max-height: calc(4 * 1.5rem + 0.75rem)"
          name="toastMessage"
          id="toastMessage"
          placeholder="Toast message"
        ></textarea>
      </div>
    </div>
  </div>

  <div class="section-divider"></div>

  <!-- Main body: 3 columns -->
  <div class="grid grid-cols-1 lg:grid-cols-3 divide-y lg:divide-y-0 lg:divide-x divide-theme">
    <!-- Col 1: Options -->
    <div class="px-8 py-6">
      <p class="section-label">Options</p>
      <div class="space-y-3">
        <label class="toggle-row">
          <input
            class="toggle-check"
            type="checkbox"
            [(ngModel)]="options.enableHtml"
            id="enableHtml"
          />
          <span class="text-base text-body">Enable HTML</span>
        </label>
        <label class="toggle-row">
          <input
            class="toggle-check"
            type="checkbox"
            [(ngModel)]="options.tapToDismiss"
            id="tapToDismiss"
          />
          <span class="text-base text-body">Tap to dismiss</span>
        </label>
        <label class="toggle-row">
          <input
            class="toggle-check"
            type="checkbox"
            [(ngModel)]="options.closeButton"
            id="closeButton"
          />
          <span class="text-base text-body">Close button</span>
        </label>
        <label class="toggle-row">
          <input
            class="toggle-check"
            type="checkbox"
            [(ngModel)]="options.newestOnTop"
            id="newestOnTop"
          />
          <span class="text-base text-body">New toasts on top</span>
        </label>
        <label class="toggle-row">
          <input
            class="toggle-check"
            type="checkbox"
            [(ngModel)]="options.showBorder"
            id="showBorder"
          />
          <span class="text-base text-body">Border</span>
        </label>

        <!-- Progress bar — always rendered, sub-options disabled when off -->
        <label class="toggle-row">
          <input
            class="toggle-check"
            type="checkbox"
            [(ngModel)]="options.progressBar"
            id="progressBar"
          />
          <span class="text-base text-body">Progress bar</span>
        </label>
        <div
          class="pl-5 flex gap-5 transition-opacity"
          [class.opacity-30]="!options.progressBar"
          [class.pointer-events-none]="!options.progressBar"
        >
          <label class="toggle-row">
            <input
              class="toggle-radio"
              type="radio"
              name="progressAnimationRadio"
              [(ngModel)]="options.progressAnimation"
              value="decreasing"
              [disabled]="!options.progressBar"
            />
            <span class="text-base text-muted">Decreasing</span>
          </label>
          <label class="toggle-row">
            <input
              class="toggle-radio"
              type="radio"
              name="progressAnimationRadio"
              [(ngModel)]="options.progressAnimation"
              value="increasing"
              [disabled]="!options.progressBar"
            />
            <span class="text-base text-muted">Increasing</span>
          </label>
        </div>

        <div class="pt-2 space-y-3" style="border-top: 1px solid var(--color-divider)">
          <label class="toggle-row">
            <input
              class="toggle-check"
              type="checkbox"
              [(ngModel)]="options.preventDuplicates"
              id="preventDuplicates"
            />
            <span class="text-base text-body">Prevent duplicates</span>
          </label>
          <div
            class="pl-5 space-y-2.5 transition-opacity"
            [class.opacity-30]="!options.preventDuplicates"
            [class.pointer-events-none]="!options.preventDuplicates"
          >
            <label class="toggle-row">
              <input
                class="toggle-check"
                type="checkbox"
                [(ngModel)]="options.countDuplicates"
                [disabled]="!options.preventDuplicates"
              />
              <span class="text-base text-muted">Count duplicates</span>
            </label>
            <label class="toggle-row">
              <input
                class="toggle-check"
                type="checkbox"
                [(ngModel)]="options.resetTimeoutOnDuplicate"
                [disabled]="!options.preventDuplicates"
              />
              <span class="text-base text-muted">Reset timeout</span>
            </label>
            <label class="toggle-row">
              <input
                class="toggle-check"
                type="checkbox"
                [(ngModel)]="options.includeTitleDuplicates"
                [disabled]="!options.preventDuplicates"
              />
              <span class="text-base text-muted">Include title</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Col 2: Timing -->
    <div class="px-8 py-6">
      <p class="section-label">Timing</p>
      <div class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="toastTimeout" class="field-label">Timeout</label>
            <input
              type="text"
              [(ngModel)]="options.timeOut"
              (ngModelChange)="fixNumber('timeOut')"
              [disabled]="options.disableTimeOut === true || options.disableTimeOut === 'timeOut'"
              class="field-input disabled:opacity-40"
              id="toastTimeout"
            />
            <span class="text-xs text-faint mt-0.5 block">0 = never</span>
          </div>
          <div>
            <label for="toastExtendedTimeout" class="field-label">Extended</label>
            <input
              type="text"
              [(ngModel)]="options.extendedTimeOut"
              (ngModelChange)="fixNumber('extendedTimeOut')"
              [disabled]="
                options.disableTimeOut === true || options.disableTimeOut === 'extendedTimeOut'
              "
              class="field-input disabled:opacity-40"
              id="toastExtendedTimeout"
            />
            <span class="text-xs text-faint mt-0.5 block">0 = never</span>
          </div>
        </div>

        <div>
          <label class="field-label mb-2.5 block">Disable Timeouts</label>
          <div class="grid grid-cols-2 gap-x-4 gap-y-2.5">
            <label class="toggle-row">
              <input
                class="toggle-radio"
                type="radio"
                [(ngModel)]="options.disableTimeOut"
                [value]="true"
              />
              <code class="text-sm text-code">true</code>
            </label>
            <label class="toggle-row">
              <input
                class="toggle-radio"
                type="radio"
                [(ngModel)]="options.disableTimeOut"
                [value]="false"
              />
              <code class="text-sm text-code">false</code>
            </label>
            <label class="toggle-row">
              <input
                class="toggle-radio"
                type="radio"
                [(ngModel)]="options.disableTimeOut"
                value="timeOut"
              />
              <code class="text-sm text-code">timeOut</code>
              <span class="text-base text-faint ml-1">only</span>
            </label>
            <label class="toggle-row">
              <input
                class="toggle-radio"
                type="radio"
                [(ngModel)]="options.disableTimeOut"
                value="extendedTimeOut"
              />
              <code class="text-sm text-code">extended</code>
              <span class="text-base text-faint ml-1">only</span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="maxNumberToasts" class="field-label">Max Toasts</label>
            <input
              [(ngModel)]="toastr.toastrConfig.maxOpened"
              (ngModelChange)="fixNumber('maxOpened')"
              type="text"
              class="field-input"
              id="maxNumberToasts"
            />
            <span class="text-xs text-faint mt-0.5 block">0 = no limit</span>
          </div>
          <div>
            <label for="easeTime" class="field-label">Ease Time</label>
            <input
              type="text"
              [(ngModel)]="toastr.toastrConfig.easeTime"
              (ngModelChange)="fixNumber('easeTime')"
              class="field-input"
              id="easeTime"
            />
          </div>
        </div>

        <label class="toggle-row">
          <input
            type="checkbox"
            class="toggle-check"
            [(ngModel)]="toastr.toastrConfig.autoDismiss"
            id="autoDismiss"
          />
          <span class="text-base text-body">Auto dismiss on max</span>
        </label>
      </div>
    </div>

    <!-- Col 3: Appearance -->
    <div class="px-8 py-6">
      <p class="section-label">Appearance</p>
      <div class="space-y-6">
        <!-- Type -->
        <div>
          <p class="field-label mb-3">Toast Type</p>
          <div class="flex flex-wrap gap-2">
            @for (t of ['success', 'info', 'warning', 'error']; track t) {
              <label class="type-pill" [class.type-pill--active]="type === t">
                <input
                  type="radio"
                  name="typeRadios"
                  [(ngModel)]="type"
                  [value]="t"
                  class="sr-only"
                />
                {{ t | titlecase }}
              </label>
            }
          </div>
        </div>

        <!-- Position -->
        <div>
          <p class="field-label mb-3">Position</p>
          <div class="grid grid-cols-2 gap-1.5">
            @for (pos of positions; track pos.value) {
              <label
                class="pos-pill"
                [class.pos-pill--active]="options.positionClass === pos.value"
                [class.opacity-30]="inline"
                [class.pointer-events-none]="inline"
              >
                <input
                  type="radio"
                  name="positionRadio"
                  [(ngModel)]="options.positionClass"
                  [value]="pos.value"
                  [disabled]="inline"
                  class="sr-only"
                />
                {{ pos.label }}
              </label>
            }
          </div>
        </div>

        <!-- Inline -->
        <div class="space-y-2">
          <label class="toggle-row">
            <input
              class="toggle-check"
              type="checkbox"
              (ngModelChange)="setInlineClass($event)"
              [(ngModel)]="inline"
              id="inline"
            />
            <span class="text-base text-body">Inline Position</span>
          </label>
          <div
            class="flex gap-5 pl-5 transition-opacity"
            [class.opacity-30]="!inline"
            [class.pointer-events-none]="!inline"
          >
            <label class="toggle-row">
              <input
                class="toggle-radio"
                type="radio"
                name="inlinePositionRadio"
                (ngModelChange)="setInlinePosition($event)"
                [(ngModel)]="inlinePositionIndex"
                [disabled]="!inline"
                [value]="0"
              />
              <span class="text-base text-body">A</span>
            </label>
            <label class="toggle-row">
              <input
                class="toggle-radio"
                type="radio"
                name="inlinePositionRadio"
                (ngModelChange)="setInlinePosition($event)"
                [(ngModel)]="inlinePositionIndex"
                [disabled]="!inline"
                [value]="1"
              />
              <span class="text-base text-body">B</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Inline containers — always rendered, disabled when not active -->
  <div class="section-divider"></div>
  <div
    class="px-8 py-5 grid grid-cols-2 gap-5 transition-opacity"
    [class.opacity-30]="!inline"
    [class.pointer-events-none]="!inline"
  >
    <div>
      <p class="field-label mb-2">Inline A</p>
      <div class="inline-drop-zone">
        <span toastContainer></span>
      </div>
    </div>
    <div>
      <p class="field-label mb-2">Inline B</p>
      <div class="inline-drop-zone">
        <span toastContainer></span>
      </div>
    </div>
  </div>

  <div class="section-divider"></div>

  <!-- Actions -->
  <div class="px-8 py-5 relative z-10">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex flex-wrap gap-2">
        <button
          (click)="toastManager.openToastAnimation(options, type, { message, title })"
          type="button"
          class="btn-primary"
        >
          Open Toast
        </button>
        <button
          (click)="toastManager.clearLastToast()"
          type="button"
          class="btn-secondary"
        >
          Clear Last
        </button>
        <button
          (click)="toastManager.clearToasts()"
          type="button"
          class="btn-secondary"
        >
          Clear All
        </button>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs text-faint uppercase tracking-wider">Custom:</span>
        <button
          (click)="toastManager.openToastNoAnimation(options, type, { message, title })"
          type="button"
          class="btn-no-anim"
        >
          No Animations
        </button>
        <button
          (click)="toastManager.openPinkToast(options, { message, title })"
          type="button"
          class="rounded-lg btn-pink"
        >
          Pink
        </button>
        <button
          (click)="toastManager.openNotyf(options, { message, title })"
          type="button"
          class="btn-notyf"
        >
          Notyf
        </button>
      </div>
    </div>
  </div>
</div>
